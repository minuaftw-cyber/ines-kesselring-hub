# Full stack: PostgreSQL + Django API/backoffice + Next.js website.
#   cp .env.example .env   (then set DJANGO_SECRET_KEY and POSTGRES_PASSWORD)
#   docker compose up --build
# Website:    http://localhost:3000
# Backoffice: http://localhost:8000/admin/

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ines
      POSTGRES_USER: ines
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ines -d ines"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000
      # Plain HTTP on localhost; set to 1 behind HTTPS in production.
      DJANGO_SECURE_COOKIES: "0"
      DATABASE_URL: postgres://ines:${POSTGRES_PASSWORD}@db:5432/ines
      MEDIA_PUBLIC_BASE_URL: http://localhost:8000
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      BACKOFFICE_URL: http://localhost:8000/admin/
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
